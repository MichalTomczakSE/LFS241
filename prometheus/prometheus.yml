global:
  scrape_interval: 15s 
  evaluation_interval: 15s 
alerting:
  alertmanagers:
    - static_configs:
        - targets:
rule_files:
scrape_configs:
  - job_name: "demo"
    static_configs:
      - targets: ["d1:8080","d2:8080","d3:8080"]
    metric_relabel_configs:
      - action: keep
        source_labels: [__name__]
        regex: '(demo_|http).*'
  - job_name: 'node'
    static_configs:
      - targets: ['192.168.0.83:9100']
  - job_name: "cadvisor"
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: 'cpu-exporter'
    static_configs:
      - targets: ['cpu-exporter:8000']
  - job_name: 'consul-sd-demo'
    consul_sd_configs:
      - server: 'consul:8500' 
    relabel_configs:
      - action: keep
        source_labels: [__meta_consul_service]
        regex: demo
  - job_name: 'file-sd-demo'
    file_sd_configs:
      - files:
        - 'targets.yml'
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
        - 'http://prometheus.io'
        - 'https://prometheus.io'
        - 'http://example.com:8080'
    relabel_configs:
      - source_labels: [__address__]
        taget_label: __param_target
      - source_labels: [__param_target] 
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
