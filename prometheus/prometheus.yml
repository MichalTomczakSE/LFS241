global:
  scrape_interval: 15s 
  evaluation_interval: 15s 
alerting:
  alertmanagers:
    - static_configs:
        - targets:
rule_files:
scrape_configs:
  - job_name: "demo"
    static_configs:
      - targets: ["d1:8080","d2:8080","d3:8080"]
  - job_name: 'node'
    static_configs:
      - targets: ['192.168.0.83:9100']
  - job_name: "cadvisor"
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: 'cpu-exporter'
    static_configs:
      - targets: ['cpu-exporter:8000']
